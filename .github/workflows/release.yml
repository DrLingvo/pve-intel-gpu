name: release

# Publish a release: push a tag v*, or run this workflow from the Actions tab with a
# tag name. Tests run first; then the script, install.sh, bios/ and CONTRACT.md are
# published with one SHA256SUMS. An existing release (for example created in the
# GitHub UI) gets the verified files attached instead.
on:
  push:
    tags: ['v*']
  # One click from the Actions tab (main): tests, then the release for this commit.
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag, must match VERSION in pve-intel-gpu.sh (e.g. v0.3.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Tests
        run: |
          shellcheck pve-intel-gpu.sh install.sh tools/stage-release.sh tests/run.sh
          (cd bios && sha256sum -c SHA256SUMS)
          bash tests/run.sh
      - name: Version matches the tag
        run: |
          v=$(sed -n 's/^VERSION="\(.*\)"/\1/p' pve-intel-gpu.sh)
          tag="${{ github.event.inputs.tag }}"; tag="${tag:-$GITHUB_REF_NAME}"
          [ "v$v" = "$tag" ] || { echo "VERSION=$v does not match tag $tag" >&2; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Stage files
        run: |
          bash tools/stage-release.sh rel
          ls -la rel
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          contract=$(cat rel/CONTRACT_VERSION)
          notes=$(cat <<EOF
          pve-intel-gpu ${TAG}: Intel iGPU on Proxmox VE (vGPU via GVT-g or SR-IOV, full passthrough).

          Host-tools contract v${contract} (CONTRACT.md). Use together with a realpc-clean-build
          release whose state records CONTRACT_VERSION=${contract}; older realpc releases work too,
          but then run "--mode reapply --vmid N" after every realpc configvm.

          vGPU technology is chosen by the iGPU generation: GVT-g on Gen8-9 (Broadwell..Comet Lake),
          SR-IOV on Gen12+ (Tiger Lake..Core Ultra). BlissOS: --guest android.

          Install on the Proxmox host (verifies SHA256SUMS, takes the shared host-tools lock):
            curl -fsSLO https://github.com/DrLingvo/pve-intel-gpu/releases/download/${TAG}/install.sh
            bash install.sh --release ${TAG} --yes
            pve-intel-gpu --mode status
            pve-intel-gpu --mode vgpu --vmid N --guest android

          Not yet tested on real hardware: start with --mode status and --dry-run.
          EOF
          )
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" rel/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" rel/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" -t "$TAG" -n "$notes"
          fi

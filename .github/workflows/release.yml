name: release

# Push a tag v* to publish a release: tests first, then the script, bios/ and
# CONTRACT.md with one SHA256SUMS for everything.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Tests
        run: |
          shellcheck pve-intel-gpu.sh tests/run.sh
          (cd bios && sha256sum -c SHA256SUMS)
          bash tests/run.sh
      - name: Version matches the tag
        run: |
          v=$(sed -n 's/^VERSION="\(.*\)"/\1/p' pve-intel-gpu.sh)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "VERSION=$v does not match tag $GITHUB_REF_NAME" >&2; exit 1; }
      - name: Stage files
        run: |
          mkdir rel
          cp pve-intel-gpu.sh CONTRACT.md bios/*.rom bios/catalog.tsv rel/
          cp bios/SHA256SUMS rel/bios-SHA256SUMS
          contract=$(sed -n 's/^CONTRACT_VERSION=//p' pve-intel-gpu.sh)
          echo "$contract" > rel/CONTRACT_VERSION
          ( cd rel && sha256sum ./* > SHA256SUMS )
          ls -la rel
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          contract=$(cat rel/CONTRACT_VERSION)
          notes=$(cat <<EOF
          pve-intel-gpu ${GITHUB_REF_NAME}: Intel iGPU on Proxmox VE (SR-IOV vGPU and full passthrough).

          Host-tools contract v${contract} (CONTRACT.md). Use together with a realpc-clean-build
          release whose state records CONTRACT_VERSION=${contract}; older realpc releases work too,
          but then run "--mode reapply --vmid N" after every realpc configvm.

          Install (keep the ROMs next to the script in bios/):
            mkdir -p pve-intel-gpu/bios && cd pve-intel-gpu
            # download pve-intel-gpu.sh, *.rom, catalog.tsv, bios-SHA256SUMS, SHA256SUMS from this release
            sha256sum -c SHA256SUMS
            mv *.rom catalog.tsv bios/ && mv bios-SHA256SUMS bios/SHA256SUMS && chmod +x pve-intel-gpu.sh
            ./pve-intel-gpu.sh --mode status

          Not yet tested on real hardware: start with --mode status and --dry-run.
          EOF
          )
          gh release create "$GITHUB_REF_NAME" rel/* -R "$GITHUB_REPOSITORY" -t "$GITHUB_REF_NAME" -n "$notes"

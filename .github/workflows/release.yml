name: release

# Push a tag v* to publish a release: tests first, then the script, bios/ and
# CONTRACT.md with one SHA256SUMS for everything.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Tests
        run: |
          shellcheck pve-intel-gpu.sh install.sh tools/stage-release.sh tests/run.sh
          (cd bios && sha256sum -c SHA256SUMS)
          bash tests/run.sh
      - name: Version matches the tag
        run: |
          v=$(sed -n 's/^VERSION="\(.*\)"/\1/p' pve-intel-gpu.sh)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "VERSION=$v does not match tag $GITHUB_REF_NAME" >&2; exit 1; }
      - name: Stage files
        run: |
          bash tools/stage-release.sh rel
          ls -la rel
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          contract=$(cat rel/CONTRACT_VERSION)
          notes=$(cat <<EOF
          pve-intel-gpu ${GITHUB_REF_NAME}: Intel iGPU on Proxmox VE (SR-IOV vGPU and full passthrough).

          Host-tools contract v${contract} (CONTRACT.md). Use together with a realpc-clean-build
          release whose state records CONTRACT_VERSION=${contract}; older realpc releases work too,
          but then run "--mode reapply --vmid N" after every realpc configvm.

          vGPU technology is chosen by the iGPU generation: GVT-g on Gen8-9 (Broadwell..Comet Lake),
          SR-IOV on Gen12+ (Tiger Lake..Core Ultra). BlissOS: --guest android.

          Install on the Proxmox host (verifies SHA256SUMS, takes the shared host-tools lock):
            curl -fsSLO https://github.com/DrLingvo/pve-intel-gpu/releases/download/${GITHUB_REF_NAME}/install.sh
            bash install.sh --release ${GITHUB_REF_NAME} --yes
            pve-intel-gpu --mode status
            pve-intel-gpu --mode vgpu --vmid N --guest android

          Not yet tested on real hardware: start with --mode status and --dry-run.
          EOF
          )
          gh release create "$GITHUB_REF_NAME" rel/* -R "$GITHUB_REPOSITORY" -t "$GITHUB_REF_NAME" -n "$notes"
